{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}

{% block body %}
<div class="box">
  <div class="box__title">{{ post.title }}</div>
  <div class="box__body post">
    <div class="post__meta">
      <a href="/">&laquo; Back to home page</a>
      <span class="post__date">Posted on {{ post.date.strftime("%d.%m.%Y") }}</span>
    </div>
    {{ post.content|safe }}
  </div>
</div>
{% endblock %}
